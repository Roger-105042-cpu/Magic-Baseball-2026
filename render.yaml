services:
  - type: web
    name: magic-baseball-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: magic-baseball-db
          property: connectionString
      - key: COOKIE_SECURE
        value: '1'
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: superadmin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: magic-baseball-db
    plan: basic-256mb
    databaseName: magic_baseball
    user: magic_baseball
